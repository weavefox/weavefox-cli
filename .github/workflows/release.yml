# Release Pipeline
#
# Triggered on push to main. Checks if the version in package.json has a
# corresponding git tag; if not, publishes npm + binaries + GitHub Release.
#
# Flow (single workflow, no tag-triggered loop):
#   push to main -> check new version -> npm publish -> tag + binaries + release
#
# Security: OIDC Trusted Publishing, zero long-lived secrets.
# Provenance: --provenance generates SLSA L3 attestation, publicly verifiable.

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────
  # Job 1: Check if this is a new release
  # ───────────────────────────────────────────────────────────────
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping release"
            echo "should-release=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: ${VERSION}"
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

  # ───────────────────────────────────────────────────────────────
  # Job 2: NPM publish (OIDC Trusted Publishing + Provenance)
  # ───────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to NPM
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install

      - name: Type check
        run: pnpm lint

      - name: Build (tsup -> dist/)
        run: pnpm build

      - name: Publish to NPM
        run: npm publish --provenance --access public

  # ───────────────────────────────────────────────────────────────
  # Job 3: Binary cross-compile + tag + GitHub Release
  # Depends on publish-npm success to ensure version consistency.
  # ───────────────────────────────────────────────────────────────
  build-and-release:
    name: Build & Release Binaries
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create tag + GitHub Release
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: pnpm install

      - uses: oven-sh/setup-bun@v2

      - name: Build all platform binaries
        run: bash scripts/build-bin.sh

      - name: Generate release summary
        run: |
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh bin/ | awk 'NR>1{print "| "$1" | "$5" | "$9" |"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat bin/checksums-sha256.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            bin/wf-darwin-arm64
            bin/wf-darwin-x64
            bin/wf-linux-x64
            bin/wf-linux-arm64
            bin/wf-windows-x64.exe
            bin/checksums-sha256.txt
